name: Test Memos add-on

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Release updater regression tests
        run: python3 -m unittest discover -s tests -p 'test_update_memos_release.py' -v
      - name: Validate start script
        run: sh -n memos/run.sh
      - name: Build Home Assistant add-on image
        run: docker build --pull -t memos-addon-ci -f memos/Dockerfile memos
      - name: Smoke-test Memos startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/memos-data"
          docker run -d --name memos-addon-ci \
            -p 127.0.0.1:15230:5230 \
            -v "$RUNNER_TEMP/memos-data:/data" \
            memos-addon-ci
          trap 'docker logs --tail 80 memos-addon-ci || true; docker rm -f memos-addon-ci || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:15230/; then
              echo "Memos HTTP startup successful"
              exit 0
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' memos-addon-ci)" != "true" ]]; then
              echo "Memos container stopped unexpectedly" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Memos startup did not complete" >&2
          exit 1
