name: Test Memos add-on

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Release updater regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate start script
        run: sh -n memos/run.sh
      - name: Go routing/security tests
        run: |
          cd memos/ingress
          GO111MODULE=off go test -v .
      - name: Build Home Assistant add-on image
        run: docker build --pull -t memos-addon-ci -f memos/Dockerfile memos
      - name: Smoke test ingress and API-only listener
        run: bash tests/smoke-addon.sh
